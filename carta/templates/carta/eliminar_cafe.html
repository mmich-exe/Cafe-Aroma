<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Café</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; color: #2C221E; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .bg-coffee { background-color: #2C221E; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#C5A059] selection:text-white">

    <header class="bg-coffee text-[#FDFBF7] py-6 px-8 shadow-sm border-b border-[#C5A059]/30">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-serif tracking-wider">Café Aroma</h1>
            <a href="{% url 'lista_carta' %}" class="text-sm text-stone-300 hover:text-[#C5A059] transition">← Volver</a>
        </div>
    </header>

    <main class="max-w-xl mx-auto px-6 py-16 w-full flex-grow">
        <div class="bg-white border border-stone-200 shadow-sm p-8 md:p-10 text-center">
            <div class="w-12 h-12 bg-rose-50 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-xl font-bold">!</div>
            
            <h2 class="text-2xl font-serif text-stone-900 mb-2">¿Estás seguro?</h2>
            <p class="text-stone-600 text-sm mb-6">Vas a eliminar permanentemente el registro de <strong class="text-stone-900">"{{ cafe.nombre }}"</strong>. Esta acción no se puede deshacer.</p>
            
            <form method="POST" class="flex justify-center gap-4 items-center">
                {% csrf_token %}
                <button type="submit" class="bg-rose-600 hover:bg-rose-700 text-white px-6 py-2.5 text-sm font-medium transition shadow-sm">
                    Sí, eliminar
                </button>
                <a href="{% url 'lista_carta' %}" class="border border-stone-300 text-stone-700 px-6 py-2.5 text-sm hover:bg-stone-50 transition">
                    Cancelar
                </a>
            </form>
        </div>
    </main>

    <footer class="bg-coffee text-stone-400 py-6 text-center text-xs border-t border-[#C5A059]/20">
        <p>© 2026 Café Aroma. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
