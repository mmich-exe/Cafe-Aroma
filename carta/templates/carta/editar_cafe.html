<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar - {{ cafe.nombre }}</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FDFBF7; color: #2C221E; }
        h1, h2, h3, .font-serif { font-family: 'Playfair Display', serif; }
        .bg-coffee { background-color: #2C221E; }
        form p { margin-bottom: 1.25rem; display: flex; flex-direction: column; }
        form label { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #78716c; margin-bottom: 0.375rem; font-weight: 600; }
        form input, form select, form textarea { border: 1px solid #d7d3cb; padding: 0.625rem 0.875rem; font-size: 0.875rem; background-color: #fff; outline: none; transition: border-color 0.2s; }
        form input:focus, form select:focus, form textarea:focus { border-color: #C5A059; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#C5A059] selection:text-white">

    <header class="bg-coffee text-[#FDFBF7] py-6 px-8 shadow-sm border-b border-[#C5A059]/30">
        <div class="max-w-2xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-serif tracking-wider">Café Aroma</h1>
            <a href="{% url 'lista_carta' %}" class="text-sm text-stone-300 hover:text-[#C5A059] transition">← Volver</a>
        </div>
    </header>

    <main class="max-w-2xl mx-auto px-6 py-12 w-full flex-grow">
        <div class="bg-white border border-stone-200 shadow-sm p-8 md:p-10">
            <h2 class="text-3xl font-serif text-stone-900 mb-2">Editar Café</h2>
            <p class="text-xs text-[#9A7B38] font-mono mb-6">Modificando: {{ cafe.nombre }}</p>
            
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="mt-8 pt-4 border-t border-stone-100 flex items-center gap-4">
                    <button type="submit" class="bg-[#C5A059] hover:bg-[#b08d4b] text-white px-6 py-2.5 text-sm font-medium tracking-wide transition shadow-sm">
                        Guardar Cambios
                    </button>
                    <a href="{% url 'lista_carta' %}" class="text-xs text-stone-500 hover:text-stone-800">Cancelar</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="bg-coffee text-stone-400 py-6 text-center text-xs border-t border-[#C5A059]/20">
        <p>© 2026 Café Aroma. Todos los derechos reservados.</p>
    </footer>

</body>
</html>
